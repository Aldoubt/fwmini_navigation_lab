name: fwmini-P1b-safety-no-CAN
on:
  push:
    paths:
      - "src/fwmini_multi_nav_bringup/**"
      - ".github/workflows/fwmini-safety-p1b.yml"
  pull_request:
    paths:
      - "src/fwmini_multi_nav_bringup/**"
      - ".github/workflows/fwmini-safety-p1b.yml"
jobs:
  no-can-safety-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 -m pip install pyyaml
      - name: Compile safe scan module and guard
        run: |
          python3 -m py_compile src/fwmini_multi_nav_bringup/fwmini_multi_nav_bringup/safety_scan.py
          python3 -m py_compile src/fwmini_multi_nav_bringup/fwmini_multi_nav_bringup/navigation_guard.py
          python3 -m py_compile src/fwmini_multi_nav_bringup/launch/fwmini_mid360_navigation.launch.py
      - name: Scan gate geometry and wiring unit tests (NO ROS, NO CAN)
        run: |
          PYTHONPATH=src/fwmini_multi_nav_bringup python3 -m unittest discover \
            -s src/fwmini_multi_nav_bringup/test -p test_safety_scan.py -v
      - name: DWB/RPP YAML contract checks
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          root = Path('src/fwmini_multi_nav_bringup/config/nav2')
          base = yaml.safe_load((root/'fwmini_mid360_nav2.yaml').read_text())
          rpp = yaml.safe_load((root/'fwmini_mid360_nav2_rpp_candidate.yaml').read_text())
          def controller(doc):
              return doc['controller_server']['ros__parameters']['FollowPath']
          assert controller(base)['plugin'] == 'dwb_core::DWBLocalPlanner'
          assert controller(rpp)['plugin'].endswith('RegulatedPurePursuitController')
          assert rpp['velocity_smoother']['ros__parameters']['max_velocity'][0] <= 0.15
          assert controller(rpp)['desired_linear_vel'] <= 0.15
          print('RPP candidate is bounded and DWB baseline is unchanged')
          PY
