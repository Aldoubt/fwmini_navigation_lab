name: FW-mini Multi-Nav Humble

on:
  push:
    branches: [feature/fwmini-multinav-humble-p0-20261016]
    paths:
      - 'src/fwmini_multi_nav_bringup/**'
      - 'tools/test_multi_nav_contracts.py'
      - '.github/workflows/multinav-humble.yml'
  pull_request:
    paths:
      - 'src/fwmini_multi_nav_bringup/**'
      - 'tools/test_multi_nav_contracts.py'
      - '.github/workflows/multinav-humble.yml'

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Offline unit tests, no robot motion
        run: |
          python3 -m unittest discover -s tools -p test_multi_nav_contracts.py -v
          python3 -m compileall -q src/fwmini_multi_nav_bringup

  humble-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Install backend binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-humble-rtabmap-ros ros-humble-slam-toolbox \
            ros-humble-cartographer-ros ros-humble-depthimage-to-laserscan \
            ros-humble-pointcloud-to-laserscan ros-humble-nav2-bringup
      - name: Colcon build + launch introspection (no processes started)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          rosdep install --from-paths src/fwmini_multi_nav_bringup \
            --ignore-src --rosdistro humble -r -y
          colcon build --base-paths src/fwmini_multi_nav_bringup \
            --packages-select fwmini_multi_nav_bringup
          source install/setup.bash
          ros2 pkg prefix fwmini_multi_nav_bringup
          ros2 launch fwmini_multi_nav_bringup bringup.launch.py --show-args
