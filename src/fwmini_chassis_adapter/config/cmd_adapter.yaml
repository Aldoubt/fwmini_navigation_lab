fwmini_chassis_adapter:
  ros__parameters:
    # Protected input is TwistStamped with a session epoch, never raw /cmd_vel.
    max_linear_x: 0.05
    max_linear_y: 0.03
    max_angular_z: 0.15
    cmd_timeout: 0.2
    feedback_timeout: 0.2
    switch_timeout: 3.0
    confirm_duration: 0.06
    confirm_samples: 3
    publish_rate: 50.0
    vendor_linear_unit: mps
    vendor_angular_unit: degps
    control_gear: 0  # Always disabled at startup. CtrlCmd modes are selected explicitly: 6 / 8.
